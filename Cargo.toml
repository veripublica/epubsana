[package]
name = "epubsana"
version = "0.18.0"
edition = "2024"
rust-version = "1.88"
description = "Repairs the EPUB defects epubveri detects — a pure-Rust, confirm-each-step EPUB fixer."
license = "AGPL-3.0-only OR LicenseRef-veripublica-Commercial"
repository = "https://github.com/veripublica/epubsana"
homepage = "https://github.com/veripublica/epubsana"
readme = "README.md"
keywords = ["epub", "epubcheck", "repair", "fix", "ebook"]
categories = ["command-line-utilities", "parser-implementations"]

# The WASM/JS boundary lives in a separate workspace member so its
# wasm-bindgen/serde/tsify deps never leak into this core crate (same pattern
# as epubveri-wasm). It reuses the core; it adds no repair logic of its own.
[workspace]
members = ["epubsana-wasm"]

[dependencies]
# The detector this repairs the output of — consumed from crates.io like any
# external user (dogfooding). Five-value `Severity` (a fatal is no longer folded
# into an error) and the `rule`/`params` sub-codes epubsana's fixers dispatch on
# both arrived on the 0.5 line, the conventions-v0.4 one.
#
# **The floor is 0.16.** Most raises have been *correctness* floors, made for the
# same reason each time: below them, a detector false positive makes some fixer
# here repair a book that was not broken. The last two are different classes —
# 0.9.26 is completeness and 0.10.0 is capability — and each says which it is.
#
# - **0.9.7.** On 0.5.x, `opf.content_document.empty_title` was an EPUB 3 rule
#   firing on EPUB 2 books, so epubsana's most active fixer wrote TOC labels into
#   the `<title>` of valid books (606 proposals on the 94-book shelf; 3 after the
#   bump). 0.9.7 also restores the per-run positions this crate's stray-text fixer
#   follows upstream to (epubveri #68).
# - **0.9.16.** Below it, a package in the OEBPS 1.2 (`openebook.org`) namespace
#   was judged by EPUB 2's rules and drew six invented errors, one of them from a
#   package grammar bound to the OPF namespace — which is exactly the rule
#   `fix.epub3_attr_in_epub2_package` dispatches on
#   (`opf.package.schema_violation`). On such a book that fixer could have
#   proposed deleting attributes from a package that was correct.
#
#   Unlike `empty_title` this one is **argued, not measured**: the shared shelf
#   holds no OEBPS 1.2 book, so there is nothing here to reproduce it on. It is
#   the same class, and the floor is where that class gets handled.
# - **0.9.26, and this one is a different class — completeness, not correctness.**
#   `fix.ncx_content_src_spaces` dispatches on `opf.ncx.content_src_unencoded_space`,
#   a rule that does not exist below 0.9.26. Under an older detector the fixer is
#   not wrong, it is *silent*: `fix.manifest_href_spaces` encodes the manifest
#   half, the NCX half is never reported, and the book comes back from a repair
#   still invalid — measured by epubveri against epubcheck 5.3.0 on all three
#   states. A user cannot tell that outcome from "epubsana could not help", which
#   is the reason to make it a floor rather than a preference.
#
#   The precedent for a non-correctness floor is 0.9.7's second clause above: the
#   stray-text fixer needs per-run positions, and a floor is how a fixer's
#   prerequisite gets stated once instead of being rediscovered per book.
#
# The bump itself cost no source change: epubsana's whole surface is
# `validate_bytes`, `report::{Report, Severity}` and the three `envelope` types
# (generic over the tool-owned slots since 0.5.3), so the 0.8.0 `Options` break
# does not reach here.
#
# - **0.10.0 (2026-08-22) is the first floor that is a *capability* floor, and
#   the first that cost source change.** `report::Message` gained
#   `violation_kind` and `rng::Blame::Text` became a struct variant, so the
#   caret had to move; below it `ViolationKind` does not exist and the
#   `violation_kind_all_six_are_known` test cannot compile. That test is the
#   reason the floor is not merely a preference: epubveri's own `Blame::kind`
#   mapping stays wildcard-free by a code comment, so **ours is the only
#   mechanical check that a seventh kind was added** (agreed in writing,
#   veripublica/epubveri#85). On an older detector that check silently does not
#   exist.
#
#   **0.11.0 (same day) is a tracking move, not a new capability floor.** Its
#   change is entirely in epubveri's CLI — `-u` now gates `--format json` and
#   `--format ids`, after Doitsu found one flag meaning two things depending on
#   the format. `validate_bytes` still returns every finding at every severity,
#   which is the boundary this project argued for with numbers and which now has
#   a test upstream. The caret is what forces the edit: `^0.10.0` stops before
#   0.11.0, so leaving it would have stranded library consumers on a line
#   epubveri had already left. Verified rather than trusted — the kind census is
#   identical across the two (39,979 / 9 / 0) and the plan digest did not move.
#
#   The behavioural risk of the bump was measured *before* it, against the
#   unreleased build: 385 books, plan digest byte-identical — 152 books planned,
#   2,156 proposals, same `--apply` indices — while 11,334 finding positions
#   moved underneath (4e36141 reports an attribute fault at the attribute). We
#   read no position anywhere, and every fixer re-sorts through a `BTree*`.
#   `plan_ab.rs` + `pos_ab.rs` in dev-examples are the instruments.
#
#   **0.13.2 (2026-09-02) is a tracking move like 0.11.0, and the reason it is
#   not a completeness floor is worth writing down, because upstream told us it
#   was one.** Their note of 2026-09-02 reported that
#   `opf.package.opf_identifier_not_empty` — the rule `fix.package_identifier`
#   shares with `opf.package.unique_identifier_unresolved` — first appears at
#   0.13.2, making that half of the fixer unreachable code below it. It is not.
#   The rule key existed at 0.11.0, **derived at runtime from the Schematron
#   pattern id** `opf-identifier-not-empty` in `schemas/package.sch:168`, and
#   0.13.2 only moved its emission into Rust byte-identically (their own
#   changelog says so). Measured here: the rule census reports **26 books / 27
#   findings on both sides of the bump**, and the plan digest does not move.
#   Their extraction searched rule-key *literals* in `src/*.rs`, which cannot
#   see a Schematron-derived key — so the same blind spot applies to the
#   retired/added key lists in that note.
#
#   What the bump does buy is the counts epubsana prints, which are the
#   detector's: below 0.13.2 they are inflated on EPUB 2 books (upstream #94,
#   1,878 shelf-wide errors). No fixer acted on any of them — the plan digest is
#   byte-identical across 444 books — so this is a reporting improvement, not a
#   correctness floor, and it is recorded as the weaker claim on purpose.
#
#   **0.13.6 (2026-09-09) is the weakest floor in this list: nothing moved at
#   all.** Four upstream releases, no source change, 230 + 22 tests green before
#   the manifest was touched — and the *whole `rule_census`* is byte-identical
#   across the boundary, not merely the plan digest. Both arms had their linkage
#   checked (`strings … | grep epubveri-0.13.x`) before either null was believed,
#   and the census is the arm that could have moved: 0.13.3 closed eleven false
#   positives and none of them had a population on this shelf. Two rows of the
#   key table upstream sent with it are wrong, neither in a direction that
#   reaches an edit — `opf.metadata.empty_element` is `OPF-072` and not
#   `OPF-034`, and `navdoc.ol.empty` is not new in 0.13.3 (it is in `src/` at
#   every tag from v0.9.20, and fires on 3 shelf books at 0.13.2). Raised by
#   note, not by issue: a wrong row in a private note is neither a rule nor a
#   commitment.
#
#   **0.13.7 (2026-09-09) is a CORRECTNESS floor, and the first one that is also
#   an API floor.** We consume `epubveri::xmlext::is_xml_blank` from it — the
#   sixth item in our whole upstream surface, and taken deliberately rather than
#   reimplemented. "Is this element empty" now has one spelling in the family,
#   which is the thing whose absence caused the defect: upstream already had the
#   predicate, already documented the trap in its docstring, and four of its own
#   sites still read `trim()`.
#
#   Below this floor, four sites here decide emptiness with Rust's `str::trim`,
#   which strips the Unicode `White_Space` class and so swallows NO-BREAK SPACE.
#   epubcheck 5.3.0 does not (its Java handler trims `<= U+0020`, its Schematron
#   uses `normalize-space()`; the two sets differ only in C0 controls that XML
#   1.0 forbids anyway, which is why one predicate covers both exactly). Two of
#   ours *delete* on that predicate and two decide whether to overwrite or
#   unwrap, so on this shelf the risk is not a bad finding, it is a bad edit.
#
#   **Upstream's own fix does not reach it, which is why the floor is not the
#   repair.** `fix.empty_metadata_element` dispatches per *file* and re-derives
#   every droppable element itself, so a finding disappearing upstream does not
#   stop the deletion: with an NBSP-only `<dc:description>` beside a genuinely
#   empty `<dc:source>`, epubveri reports only the second and we dropped both.
#   Measured as a fixture (`nbsp_probe.rs` in dev-examples) — no book on the
#   474-book shelf holds the shape, and the whole-shelf plan digest is
#   byte-identical across the change, so the shelf can neither confirm nor deny
#   any of this.
#
#   **0.14 (2026-09-11) is a CAPABILITY floor, and it is what makes this crate's
#   OPF-090 fixer honest.** Two things arrive with it, and neither is optional
#   for the way `fix.non_preferred_media_type` now works:
#
#   - `opf.manifest_item.non_preferred_media_type` stops naming a replacement
#     the resource's own signature rules out, so `params` may have length **1**
#     — a *decline* this crate reads and obeys. Below the floor that answer does
#     not exist and the fixer would rename regardless.
#   - only a real media type reaches `params[1]`. **0.13.x put the human hint
#     `font/(ttf|otf)` there** for `application/font-sfnt`, which a fixer writing
#     `params[1]` verbatim into a manifest would turn into a defect of its own.
#     `is_media_type` guards that shape, but the guard is a seatbelt: the floor
#     is the contract.
#
#   `Envelope::for_tool` also gained a required `convention` parameter, which is
#   the point of it — 0.13.x hard-coded epubveri's own key into *our* envelope,
#   so our output claimed their convention version (right by accident at "0.4").
#   Ours is now stated in `envelope.rs` and moves when we implement v0.5.0, not
#   when the dependency does.
#
#   Measured across the boundary on the 474-book shelf: the whole-shelf plan
#   digest and the **entire** `regression_audit` output are byte-identical (194
#   books planned, 2,337 proposals, errors 40,584 → 15,719, 73 fully valid, zero
#   regressions). Not a vacuous null — this fixer carries 10 of those proposals
#   and 50 renames, so a `params` answer that failed to arrive would have deleted
#   every one of them.
#
#   **0.18.0 (2026-09-25) is a TRACKING floor.** A minor, so the caret on 0.17
#   stops before it and the edit is forced. No source change and no API change
#   upstream. It adds 71 rule keys (EDUPUB, Dictionaries, Indexes, collections,
#   ARIA roles, non-space RSC-020 under their own keys, so the space fixers never
#   receive them) and removes four false positives, none of which we dispatch
#   on. The one that touches us: `opf.package.opf_itemref_resolves` now fires
#   beside OPF-049 on the same itemref, so `fix.spine_dangling_itemref` clears
#   two findings where it cleared one. Measured on the 474-book shelf, both arms'
#   linkage checked: plan digest, `regression_audit` and the full `rule_census`
#   are all byte-identical. None of the new rules has a population here, so this
#   is a null about the shelf, not about the rules.
#
#   **0.17.4 (2026-09-23) is a SECURITY floor, and a compile-time one.** We
#   call `epubveri::xmlguard::check` before every roxmltree parse, because our
#   fixers parse text the detector refused or never saw (`toc_labels` walks
#   every content document; `PreparedDoc` rewrites before parsing). Without it
#   a 1.8 KB entity expansion cost 5 GB and 500,000 nested elements aborted the
#   process on a stack overflow, both measured on 0.17.0 + epubveri 0.17.1.
#   0.17.2 introduced the guard; 0.17.3 is the first with all four limits
#   (depth, expansion, attributes per element, elements per document). Taken
#   rather than copied: 0.17.1's own scan could be walked past nine ways.
#   The floor names 0.17.4, the current release, though its code is identical
#   to 0.17.3 (a README-only release): the floor should name what was tested.
#
#   **0.17 (2026-09-23) is a CAPABILITY floor, and a compile-time one.** It
#   adds `envelope::Outcome::Reverted` (conventions v0.6.0, #31), which our
#   `From<crate::Outcome>` maps per-fix rollback (#7) onto. Below it the
#   envelope has no way to say a fix was undone, and the only honest options
#   were refusing the json run or not reverting; 0.17 removes both. Nothing
#   else in the envelope, `rule`, `location`, `params`, `violation_kind` or
#   `is_xml_blank` changed (epubveri's note), and `Outcome` stays exhaustive
#   until 1.0. Pre-tested against the branch commit `ad05f82` before it was
#   released.
#
#   **0.16 (2026-09-22) is a TRACKING floor, not a correctness one.** It spans
#   0.15.0 (epubcheck 5.4.0 parity), 0.15.1, 0.15.2 and 0.16.0 (`aria-*` value
#   spaces). No source change; the only break upstream names
#   (`rng::datatype::Datatype` gained `Float`) is outside our surface. The new
#   ARIA findings arrive as `InvalidAttributeValue` with `params[0] =
#   "aria-…"`, and both fixers on that kind narrow on `params[0]` (`lang`/
#   `xml:lang`, `id`), so they decline them — correctly, since an invalid ARIA
#   value has no inferable replacement. Zero shelf books carry one.
#
#   Measured across the boundary on the 474-book shelf: the whole-shelf plan
#   digest is byte-identical (2,407 lines), per-fixer counts identical, 73 fully
#   valid, zero regressions at any severity. What moved is the detector's
#   view alone: errors 40,615 → 15,728 becomes 40,614 → 15,727 (one `RSC-014`
#   downgraded to usage), and all findings gain +383 before *and* +383 after —
#   new usage findings (`OBS-001` ×7 keys, `HTM-062`, `RSC-036`) that we neither
#   repair nor author.
#
# Tracking policy, agreed with epubveri 2026-08-05: **track loosely** — a caret on
# the current minor, re-measure when a minor lands, don't chase patches. For an
# irreversible repairer, a newer detector only matters when the rules we consume move, and
# across 24 releases exactly two of ours did. 0.9.14 → 0.9.16 was the same story
# measured again: on the 146-book shelf the whole-shelf regression audit is
# byte-identical across the two, and the full rule census differs by exactly one
# row — the new `opf.guide.reference_fragment_not_defined`, 1 finding in 1 book.
#
# For local co-development of epubveri, add an uncommitted override:
#   [patch.crates-io] epubveri = { path = "../epubveri" }
epubveri = "0.18.0"
# Pure-Rust only (no C deps), same philosophy as epubveri: zip's "deflate"
# feature uses zlib-rs (Rust) on the 8.x line; bzip2/zstd (C) stay disabled.
# Aligned to epubveri's zip major — the family shares one zip version because
# epubsana re-emits containers epubveri reads. NB: 8.x's deflate backend differs
# from 2.x, so repaired files' bytes change (same content, still deterministic).
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# Structural editing for content-model fixers: parse an XHTML document to find
# a node's exact byte range and edit it surgically (preserving everything
# else). Pure-Rust, and already epubveri's own XML parser — no new transitive
# weight, and byte ranges line up with the positions epubveri reports.
# 0.21 matches attributes by local name (ignoring namespace); see the
# `attr_no_ns` helper in src/fixers.rs for how no-namespace lookups stay exact.
roxmltree = "0.21"
# `--format json`: the shared veripublica envelope (FORMATS.md). serde_json is
# the CLI's only user, but the envelope types are public so the wasm binding and
# any embedder emit the identical shape.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2

# roxmltree's parser recurses once per nesting level. Unoptimised, it aborts
# a 2 MiB thread (the `cargo test` default) at 125 levels, below the 256
# `epubveri::xmlguard` admits, so a debug build could be crashed by a document
# the guard accepts. Optimising this one crate is enough: it then parses 800.
# Measured by epubveri (2026-09-23) after we reported the debug-build gap.
# Cargo ignores a dependency's profile settings, so this has to live in the
# root manifest of whoever builds; it does not reach crates that depend on us.
[profile.dev.package.roxmltree]
opt-level = 1

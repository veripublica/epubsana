[package]
name = "epubsana-wasm"
version = "0.17.2"
edition = "2024"
rust-version = "1.88"
description = "WebAssembly bindings for epubsana — repair EPUB defects in the browser, no upload."
license = "AGPL-3.0-only OR LicenseRef-veripublica-Commercial"
# npm's canonical repository.url form (git+….git). This crate isn't published to
# crates.io (publish = false); its only consumer is wasm-pack → the generated
# npm package under the @veripublica scope.
repository = "git+https://github.com/veripublica/epubsana.git"
homepage = "https://github.com/veripublica/epubsana"
readme = "README.md"
keywords = ["epub", "repair", "fix", "wasm", "ebook"]
publish = false

# A thin JS boundary over epubsana's public API; no repair logic of its own.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
epubsana = { path = ".." }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
# tsify derives both serde (de)serialization and a real TypeScript .d.ts
# for the returned types, and pulls in serde-wasm-bindgen transitively.
#
# This was `tsify-next` until 2026-09-23, when a RustSec audit flagged it:
# RUSTSEC-2025-0048 marks the fork unmaintained and advises upstream `tsify`,
# which resumed. Same version number, feature and attribute, so the move is the
# import path and this line. epubveri made the same move on 2026-08-03.
#
# Held at 0.5.6 in `Cargo.lock`, as epubveri holds it: 0.5.7 deprecates the
# `#[tsify(into_wasm_abi)]` every returned type here uses. Pin BOTH halves when
# moving it (`cargo update -p tsify --precise …`, then `-p tsify-macros`), since
# the macro is what emits the deprecated reference.
tsify = { version = "0.5", features = ["js"] }

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # ubuntu-latest ships stable Rust + rustfmt; we only add the wasm target
      # for the smoke builds below. All deps (epubveri, zip, roxmltree, and the
      # wasm crate's wasm-bindgen/tsify) come from crates.io — no sibling checkout.
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Format (cargo fmt --check)
        run: cargo fmt --all --check

      - name: Build (workspace)
        run: cargo build --workspace --locked

      - name: Test (workspace)
        run: cargo test --workspace --locked

      # A gate nothing here had, and its absence is not theoretical: the day it
      # was added it caught a doc link to a private item that had shipped in the
      # previous release. epubveri found six defects of the same kinds the same
      # way (broken intra-doc links, bare URLs, an indented shell snippet being
      # compiled as a Rust doctest) and passed the tip on. Warnings are denied
      # because a rustdoc warning is the only signal these produce.
      - name: Docs (rustdoc, warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      # Prove the repairer still compiles to WebAssembly: the core library and
      # the epubsana-wasm bindings crate (which exercises the wasm-bindgen /
      # tsify codegen). A full `wasm-pack build` runs in the Pages workflow;
      # this is the lighter, tooling-free CI smoke test.
      # A version requirement is a promise: "this crate builds against anything
      # from here up". It was broken once — `epubveri = "0.5"` was declared while
      # the code needed 0.5.3's envelope types, so a consumer whose lockfile held
      # 0.5.2 got a compile error out of a released crate. Build against the
      # *declared minimum* to keep the promise honest. epubveri is the dependency
      # whose API epubsana tracks release by release, so it is the one that earns
      # this check.
      - name: Build against the declared minimum epubveri
        run: |
          set -euo pipefail
          # The floor is written as a caret, and it is spelled either way on
          # purpose: `0.14` when tracking a minor, `0.13.7` when a specific
          # patch is load-bearing. Read the version out, then fill in a missing
          # patch component — a two-component caret's minimum is `X.Y.0`. The
          # earlier expression matched only the three-component spelling and,
          # when the floor moved to `0.14`, silently handed `cargo update` the
          # whole line instead of failing to match.
          min=$(grep -E '^epubveri = "' Cargo.toml \
                | sed -E 's/^epubveri = "\^?([0-9]+(\.[0-9]+){1,2})".*/\1/')
          case "$min" in
            *.*.*) ;;
            *.*)   min="$min.0" ;;
            *)     echo "error: could not read the epubveri floor from Cargo.toml (got '$min')" >&2
                   exit 1 ;;
          esac
          echo "declared minimum: $min"
          cargo update -p epubveri --precise "$min"
          cargo check --workspace
          git checkout -- Cargo.lock

      - name: Build core lib for wasm32
        run: cargo build --lib --target wasm32-unknown-unknown --locked

      - name: Build epubsana-wasm for wasm32
        run: cargo build -p epubsana-wasm --target wasm32-unknown-unknown --locked
